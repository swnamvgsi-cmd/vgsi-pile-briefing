<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VGSI PILE | PHC Pile Solutions</title>
  <style>
    :root{
      --navy:#102a43;--blue:#1677c8;--sky:#eaf4fb;--ink:#17212b;--muted:#667085;
      --line:#d8e0e8;--bg:#f4f6f8;--white:#fff;--green:#13795b;--orange:#b54708;--red:#b42318
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Arial","Noto Sans",sans-serif;letter-spacing:0;overflow-x:hidden}
    a{color:var(--blue)}
    button{font:inherit}
    .wrap{width:100%;max-width:1420px;min-width:0;margin:0 auto;padding:22px}
    header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:16px}
    .brand{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:5px}
    h1{font-size:26px;line-height:1.25;margin:0 0 6px;color:var(--navy)}
    h2{font-size:18px;margin:0 0 12px;color:var(--navy)}
    h3{font-size:15px;margin:0;line-height:1.4}
    p{font-size:13px;line-height:1.65;margin:8px 0 0;color:#344054}
    .muted,.stamp{font-size:12px;line-height:1.55;color:var(--muted)}
    p,.muted,.thesis,.checkpoint,li,td,th{overflow-wrap:anywhere;word-break:normal}
    .header-tools{display:flex;align-items:flex-start;gap:12px}
    .stamp{text-align:right;white-space:nowrap}
    .language-group{display:flex;border:1px solid #b7d0e8;background:#fff;border-radius:6px;overflow:hidden}
    .language{border:0;border-right:1px solid #d8e4ef;background:#fff;color:var(--muted);padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
    .language:last-child{border-right:0}
    .language.active{background:var(--blue);color:#fff}
    .language:hover:not(.active){background:#f2f8fd;color:var(--navy)}
    .panel,.capability,.assessment,.news,.kpi{min-width:0;background:var(--white);border:1px solid var(--line);border-radius:8px}
    .hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(330px,.7fr);gap:14px;margin-bottom:16px}
    .company{display:grid;grid-template-columns:340px 1fr;overflow:hidden;min-height:280px}
    .company img{width:100%;height:100%;object-fit:cover;background:#e5e7eb}
    .company-copy,.status,.section-panel,.location-copy{min-width:0}
    .company-copy{padding:20px}
    .company-copy .label{display:inline-block;font-size:11px;font-weight:800;color:var(--blue);margin-bottom:10px}
    .company-copy h2{font-size:23px;margin-bottom:7px}
    .thesis{border-left:4px solid var(--blue);padding-left:12px;margin-top:16px;font-size:14px;line-height:1.7}
    .status{padding:18px;display:flex;flex-direction:column;justify-content:space-between}
    .status-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
    .state{font-size:11px;font-weight:800;color:var(--green);background:#e8f5ef;border-radius:999px;padding:4px 7px}
    .status-value{font-size:38px;font-weight:800;color:var(--navy);margin:10px 0 2px}
    .status-label{font-size:13px;font-weight:800;color:var(--green)}
    .status-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
    .status-grid div{background:#f7f9fb;border:1px solid #e7edf3;padding:10px;border-radius:6px}
    .status-grid span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
    .status-grid strong{font-size:13px}
    .section{margin-bottom:16px}
    .detail-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:16px;overflow:hidden}
    .detail-strip div{padding:13px 14px;border-right:1px solid var(--line)}
    .detail-strip div:last-child{border-right:0}
    .detail-strip span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
    .detail-strip strong{font-size:13px;color:var(--navy)}
    .section-intro{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:12px}
    .section-intro h2{margin-bottom:3px}
    .kpi-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
    .kpi{padding:14px;min-height:116px}
    .kpi span{display:block;font-size:11px;color:var(--muted)}
    .kpi strong{display:block;font-size:22px;color:var(--navy);margin:12px 0 5px}
    .kpi small{display:block;font-size:11px;line-height:1.45;color:var(--muted)}
    .kpi.good{border-top:4px solid var(--green)}.kpi.risk{border-top:4px solid var(--red)}
    .two{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}
    .section-panel{padding:16px}
    .chart-block{margin-top:16px}
    .chart-title{font-size:12px;font-weight:800;color:var(--navy);margin-bottom:8px}
    .bars{display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:180px;border-bottom:1px solid var(--line);gap:18px;padding:0 12px}
    .bar-item{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
    .bar-value{font-size:11px;font-weight:700;color:#475467}
    .bar{width:min(42px,70%);background:var(--blue);min-height:5px}
    .bar.inventory{background:var(--orange)}
    .bar-month{font-size:11px;color:var(--muted);padding:5px 0 8px}
    table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px}
    th,td{padding:10px;border-bottom:1px solid #e8edf2;text-align:right;line-height:1.45}
    th:first-child,td:first-child{text-align:left;font-weight:700}
    th{background:#eef5fa;color:var(--navy)}
    .analysis{margin-top:12px;background:#f7fafc;border-left:4px solid var(--blue);padding:12px;font-size:13px;line-height:1.65}
    .capability-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .capability{padding:15px;min-height:230px;border-top:4px solid var(--blue)}
    .capability-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .capability-head span{font-size:11px;font-weight:800;color:var(--blue);background:var(--sky);border-radius:999px;padding:4px 7px}
    .capability>strong{display:block;font-size:17px;color:var(--navy);margin:15px 0 5px}
    .checkpoint{margin-top:12px;padding-top:10px;border-top:1px solid #e6edf3;font-size:12px;line-height:1.6;color:#475467}
    .assessment-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
    .assessment{padding:15px;min-height:255px}
    .assessment.positive{border-top:4px solid var(--green)}
    .assessment.risk{border-top:4px solid var(--orange)}
    .assessment>span{font-size:11px;font-weight:800;color:var(--muted)}
    .assessment h3{font-size:17px;color:var(--navy);margin-top:8px}
    .assessment ul{margin:13px 0 0;padding-left:18px}
    .assessment li{font-size:12px;line-height:1.65;margin-bottom:8px;color:#344054}
    .project-list{display:grid;grid-template-columns:1fr;gap:12px}
    .project-group{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
    .project-group-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:11px;border-bottom:2px solid var(--blue)}
    .project-group-head h3{font-size:16px;color:var(--navy)}
    .project-count{font-size:11px;font-weight:800;color:var(--blue);background:var(--sky);border-radius:999px;padding:4px 8px}
    .project-group ul{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:22px;list-style:none;margin:10px 0 0;padding:0}
    .project-group li{border-bottom:1px solid #edf1f5}
    .project-group li:last-child{border-bottom:0}
    .project-group a{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;text-decoration:none;color:var(--ink);font-size:12px;line-height:1.45}
    .project-group a:hover{color:var(--blue)}
    .project-arrow{flex:0 0 auto;color:var(--blue);font-weight:800}
    .gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .gallery-item{display:block;overflow:hidden;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px}
    .gallery-item img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#e5e7eb}
    .gallery-copy{padding:12px 13px}
    .gallery-copy strong{display:block;font-size:13px;color:var(--navy);line-height:1.4}
    .gallery-copy span{display:block;margin-top:4px;font-size:11px;color:var(--muted);line-height:1.45}
    .gallery-item:hover strong{color:var(--blue)}
    .location{display:grid;grid-template-columns:380px 1fr;overflow:hidden;min-height:310px}
    .location-copy{padding:18px}
    .location iframe{width:100%;height:100%;border:0;min-height:310px}
    .address{font-size:17px;font-weight:800;color:var(--navy);line-height:1.5;margin:12px 0}
    .button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #b7d0e8;background:#f2f8fd;border-radius:6px;padding:9px 12px;font-size:12px;font-weight:800;margin-top:14px}
    .news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .news{padding:14px}
    .news-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .news-meta span{font-size:11px;font-weight:800;border-radius:999px;padding:4px 7px;background:var(--sky);color:var(--blue)}
    .news-meta time{font-size:11px;color:var(--muted)}
    .news h3{margin-top:12px}.news a{display:inline-block;margin-top:10px;font-size:12px;font-weight:800}
    .sources{display:flex;gap:8px;flex-wrap:wrap;padding:14px}
    .sources a,.source-pill{font-size:12px;font-weight:700;text-decoration:none;border:1px solid #c7d7e7;background:#f6f9fc;border-radius:6px;padding:7px 9px;color:var(--blue)}
    .footnote{font-size:11px;color:var(--muted);line-height:1.6;margin-top:10px}
    @media(max-width:1100px){
      .hero,.two{grid-template-columns:1fr}.detail-strip,.kpi-grid{grid-template-columns:repeat(3,1fr)}
      .capability-grid,.gallery-grid{grid-template-columns:1fr 1fr}.assessment-grid{grid-template-columns:1fr 1fr}
      .project-group ul{grid-template-columns:1fr 1fr}.location{grid-template-columns:1fr}
    }
    @media(max-width:680px){
      .wrap{padding:12px}header{flex-direction:column}.header-tools{width:100%;flex-direction:column;align-items:flex-start}
      .language{padding:8px 9px}
      h1,h2,h3,.address{overflow-wrap:anywhere}.stamp{text-align:left;white-space:normal}.company{grid-template-columns:minmax(0,1fr)}.company img{height:230px}
      .section-intro{display:block}.detail-strip,.kpi-grid,.capability-grid,.assessment-grid,.project-list,.news-grid,.gallery-grid{grid-template-columns:1fr}
      .project-group ul{grid-template-columns:1fr}
      .bars{gap:7px;padding:0}.bar{width:28px}
    }
  </style>
</head>
